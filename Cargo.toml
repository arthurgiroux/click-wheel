[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/OWNER/click-wheel"
publish = false

[workspace.dependencies]
click-wheel-formats = { path = "crates/click-wheel-formats" }
click-wheel-device = { path = "crates/click-wheel-device" }
click-wheel-library = { path = "crates/click-wheel-library" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
